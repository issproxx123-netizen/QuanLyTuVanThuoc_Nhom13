name: Báo cáo lỗi
about: Ghi nhận lỗi phát hiện trong kiểm thử
labels: ["bug"]
body:
  - type: input
    id: jira
    attributes:
      label: Jira Issue
      placeholder: SCRUM-XX
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Mức độ nghiêm trọng
      options: [Low, Medium, High, Critical]
    validations:
      required: true
